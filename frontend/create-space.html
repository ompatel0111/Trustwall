<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Space — TrustFrame</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="app-shell">
    <!-- ── Sidebar ───────────────────────────────────────────── -->
    <aside id="sidebar" class="sidebar" role="navigation" aria-label="Main navigation">
      <div class="sidebar-logo">
        <img src="/images/logo.png" alt="TrustFrame" style="width:34px;height:34px;object-fit:contain;border-radius:8px;">
        <span class="sidebar-logo-name"><span class="brand-trust">Trust</span><span class="brand-frame">Frame</span></span>
      </div>

      <nav class="sidebar-nav">
        <a href="/dashboard.html" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Overview
        </a>
        <a href="/spaces.html" class="nav-link active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Spaces
        </a>
        <a href="/testimonials.html" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          Testimonials
        </a>
        <a href="/analytics.html" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Analytics
        </a>
        <a href="/embed.html" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          Embed
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div id="sidebar-avatar" class="avatar avatar-sm">…</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebar-user-name">…</div>
            <div class="sidebar-user-email" id="sidebar-user-email"></div>
          </div>
        </div>
        <button id="btn-logout" class="btn btn-ghost btn-sm w-full mt-2" style="justify-content:flex-start;color:var(--muted)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign out
        </button>
      </div>
    </aside>

    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div class="main-content">
      <header class="mobile-header">
        <button id="hamburger" class="hamburger" aria-label="Toggle menu"><span></span><span></span><span></span></button>
        <span style="font-family:var(--font-head);font-weight:800;font-size:1rem"><span style="color:#FFFFFF">Trust</span><span style="color:#a78bfa">Frame</span></span>
        <div style="width:36px"></div>
      </header>

      <div class="page-header">
        <div>
          <h1 class="page-title">Create a Space</h1>
          <p class="text-sm text-muted mt-2">A Space is where you collect and organize customer testimonials.</p>
        </div>
      </div>

      <main class="page-body" style="max-width:680px">
        <div class="card">
          <form id="form-create-space-page">
            <div style="display:flex;flex-direction:column;gap:var(--space-5)">
              <div class="form-group">
                <label class="form-label" for="new-space-name">Space Name <span style="color:var(--error)">*</span></label>
                <input type="text" id="new-space-name" name="name" class="input" placeholder="e.g. Acme Corp" required maxlength="100">
              </div>

              <div class="form-group">
                <label class="form-label" for="new-space-slug">
                  URL Slug <span class="form-hint" style="font-weight:400">— auto-generated from name</span>
                </label>
                <div style="display:flex;align-items:center;gap:0">
                  <span class="input" style="border-radius:var(--radius-md) 0 0 var(--radius-md);border-right:none;background:var(--off-white);color:var(--muted);white-space:nowrap;width:auto">/collect/</span>
                  <input type="text" id="new-space-slug" name="slug" class="input" style="border-radius:0 var(--radius-md) var(--radius-md) 0" placeholder="acme-corp" required pattern="[a-z0-9\-]+" minlength="3" maxlength="50">
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="new-space-description">Description</label>
                <input type="text" id="new-space-description" name="description" class="input" placeholder="Brief description of your business" maxlength="200">
              </div>

              <div class="form-group">
                <label class="form-label" for="new-space-prompt">Collection Prompt</label>
                <input type="text" id="new-space-prompt" name="prompt" class="input" value="How was your experience?" maxlength="200">
                <span class="form-hint">The main headline your customers see on the collection form.</span>
              </div>

              <label style="display:flex;align-items:center;gap:12px;cursor:pointer">
                <input type="checkbox" id="new-space-rating" name="enable_rating" checked style="accent-color:var(--violet);width:16px;height:16px">
                <span class="form-label" style="margin:0">Enable star ratings</span>
              </label>

              <div class="divider"></div>

              <div class="flex justify-between items-center">
                <a href="/spaces.html" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary"><span class="btn-text">Create Space</span></button>
              </div>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <div id="toast-container" aria-live="polite"></div>
  <script type="module">
    import api from './js/api.js';
    import { requireAuth, toast, setLoading, clearLoading, slugify, createAvatar } from './js/utils.js';

    const user = await requireAuth();
    if (user) {
      document.getElementById('sidebar-user-name').textContent = user.name;
      document.getElementById('sidebar-user-email').textContent = user.email;
      const av = createAvatar(user.name, 'sm');
      document.getElementById('sidebar-avatar').replaceWith(av);
      av.id = 'sidebar-avatar';
    }

    document.getElementById('btn-logout')?.addEventListener('click', async () => {
      await api.post('/api/auth/logout');
      window.location.href = '/login.html';
    });

    const nameInput = document.getElementById('new-space-name');
    const slugInput = document.getElementById('new-space-slug');
    nameInput?.addEventListener('input', () => {
      if (slugInput && !slugInput.dataset.manualEdit) {
        slugInput.value = slugify(nameInput.value);
      }
    });
    slugInput?.addEventListener('input', () => {
      slugInput.dataset.manualEdit = 'true';
    });

    const form = document.getElementById('form-create-space-page');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = form.querySelector('button[type=submit]');
      setLoading(btn);

      const payload = {
        name: nameInput.value.trim(),
        slug: slugInput.value.trim(),
        description: document.getElementById('new-space-description').value.trim(),
        prompt: document.getElementById('new-space-prompt').value.trim(),
        enable_rating: document.getElementById('new-space-rating').checked
      };

      const res = await api.post('/api/spaces', payload);
      clearLoading(btn);

      if (res?.ok) {
        toast('Space created successfully!', 'success');
        setTimeout(() => { window.location.href = '/spaces.html'; }, 800);
      } else {
        toast(res?.data?.message || 'Failed to create space.', 'error');
      }
    });
  </script>
</body>
</html>
