<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testimonials — TrustFrame</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" role="navigation" aria-label="Main navigation">
      <div class="sidebar-logo">
        <img src="/images/logo.png" alt="TrustFrame" style="width:34px;height:34px;object-fit:contain;border-radius:8px;">
        <span class="sidebar-logo-name"><span class="brand-trust">Trust</span><span class="brand-frame">Frame</span></span>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard.html" class="nav-link"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Overview</a>
        <a href="/spaces.html" class="nav-link"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Spaces</a>
        <a href="/testimonials.html" class="nav-link active" aria-current="page"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>Testimonials</a>
        <a href="/analytics.html" class="nav-link"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Analytics</a>
        <a href="/campaigns.html" class="nav-link"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>Campaigns</a>
        <a href="/embed.html" class="nav-link"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>Embed</a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user"><div id="sidebar-avatar" class="avatar avatar-sm">…</div><div class="sidebar-user-info"><div class="sidebar-user-name" id="sidebar-user-name">…</div><div class="sidebar-user-email" id="sidebar-user-email"></div></div></div>
        <button id="btn-logout" class="btn btn-ghost btn-sm w-full mt-2" style="justify-content:flex-start;color:var(--muted)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign out</button>
      </div>
    </aside>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div class="main-content">
      <header class="mobile-header">
        <button id="hamburger" class="hamburger" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span><span></span></button>
        <span style="font-family:var(--font-head);font-weight:800;font-size:1rem"><span style="color:#FFFFFF">Trust</span><span style="color:#a78bfa">Frame</span></span>
        <div style="width:36px"></div>
      </header>

      <div class="page-header">
        <div>
          <h1 class="page-title">Testimonials</h1>
          <p class="text-sm text-muted mt-2"><span id="result-count">…</span></p>
        </div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:8px">
            <label for="space-select" class="text-xs text-muted" style="font-weight:600;text-transform:uppercase;letter-spacing:0.05em">Space:</label>
            <select id="space-select" class="input hidden" style="width:auto;min-width:170px;padding:0.45rem 2.2rem 0.45rem 0.85rem;font-size:0.875rem" aria-label="Select space"></select>
          </div>
          <div class="search-wrap">
            <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" id="search-input" class="input" placeholder="Search testimonials…" style="width:200px" aria-label="Search testimonials">
          </div>
        </div>
      </div>

      <div id="no-spaces-state" class="empty-state hidden" style="padding:4rem 2rem">
        <div class="empty-icon">📁</div>
        <div class="empty-title">No spaces found</div>
        <div class="empty-desc">You need at least one Space before moderating testimonials.</div>
        <a href="/create-space.html" class="btn btn-primary mt-4">+ Create Space</a>
      </div>

      <main class="page-body" id="testimonials-main">
        <!-- Status tabs -->
        <div class="tabs mb-4" role="tablist">
          <button class="tab-btn active" role="tab" data-status="all" aria-selected="true">All</button>
          <button class="tab-btn" role="tab" data-status="pending" aria-selected="false">Pending</button>
          <button class="tab-btn" role="tab" data-status="approved" aria-selected="false">Approved</button>
          <button class="tab-btn" role="tab" data-status="rejected" aria-selected="false">Rejected</button>
          <button class="tab-btn" role="tab" data-status="archived" aria-selected="false">Archived</button>
        </div>

        <!-- Advanced filters -->
        <div style="display:flex;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-4);align-items:center">
          <select id="filter-rating" class="input" style="width:auto;padding:0.4rem 0.8rem;font-size:0.8rem">
            <option value="">All ratings</option>
            <option value="5">5 ★</option>
            <option value="4">4 ★</option>
            <option value="3">3 ★</option>
            <option value="2">2 ★</option>
            <option value="1">1 ★</option>
          </select>
          <input type="text" id="filter-tag" class="input" placeholder="Filter by tag…" style="width:140px;padding:0.4rem 0.8rem;font-size:0.8rem">
          <button id="clear-filters" class="btn btn-ghost btn-sm">✕ Clear filters</button>
        </div>

        <!-- Bulk toolbar (hidden until items selected) -->
        <div id="bulk-toolbar" class="hidden" style="display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);background:var(--violet-xlight);border:1px solid rgba(124,58,237,0.2);border-radius:var(--radius-md);margin-bottom:var(--space-4);flex-wrap:wrap">
          <span id="bulk-count" style="font-size:var(--text-sm);font-weight:700;color:var(--violet)">0 selected</span>
          <button class="btn btn-sm btn-primary" id="bulk-approve">✓ Approve</button>
          <button class="btn btn-sm btn-secondary" id="bulk-reject">✗ Reject</button>
          <button class="btn btn-sm btn-ghost" id="bulk-archive">Archive</button>
          <button class="btn btn-sm btn-danger" id="bulk-delete">🗑 Delete</button>
          <button class="btn btn-sm btn-ghost" id="bulk-clear" style="margin-left:auto">✕ Clear</button>
        </div>

        <div class="card" style="padding:0">
          <div id="testimonials-list" style="padding:0 var(--space-6)">
            <!-- Rendered by testimonials.js -->
          </div>
        </div>

        <!-- Pagination -->
        <div id="pagination" class="flex gap-2 mt-6 justify-center flex-wrap"></div>
      </main>
    </div>
  </div>

  <div id="toast-container" aria-live="polite"></div>
  <script type="module" src="js/testimonials.js"></script>
  <script>
    document.getElementById('btn-logout')?.addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method:'POST', credentials:'include' });
      window.location.href = '/login.html';
    });
    const hamburger = document.getElementById('hamburger');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    hamburger?.addEventListener('click', () => { sidebar?.classList.toggle('open'); overlay?.classList.toggle('open'); });
    overlay?.addEventListener('click', () => { sidebar?.classList.remove('open'); overlay?.classList.remove('open'); });
  </script>
</body>
</html>
