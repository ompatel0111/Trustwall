<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password — TrustFrame</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-brand" aria-hidden="true">
      <div class="auth-brand-logo">
        <img src="/images/logo.png" alt="TrustFrame">
        <span class="auth-brand-name">TrustFrame</span>
      </div>
      <div class="auth-brand-content">
        <h1 class="auth-brand-headline">Reset your<br>password.</h1>
        <p class="auth-brand-sub">Enter your email and we'll generate a reset token for you.</p>
      </div>
    </div>
    <div class="auth-form-panel">
      <div class="auth-form-box">
        <div class="auth-form-header">
          <h2 class="auth-form-title">Forgot password</h2>
          <p class="auth-form-sub">Enter your email address to receive a password reset token.</p>
        </div>
        <form id="form-forgot" class="auth-form" novalidate>
          <div class="auth-alert auth-alert-error hidden" role="alert" aria-live="polite"></div>
          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <input type="email" id="email" name="email" class="input" placeholder="you@company.com" autocomplete="email" required>
          </div>
          <button type="submit" class="btn btn-primary"><span class="btn-text">Send reset token</span></button>
        </form>
        <div class="auth-link mt-6"><a href="/login.html">← Back to login</a></div>
      </div>
    </div>
  </div>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
