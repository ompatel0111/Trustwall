<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testimonials Widget</title>
  <style>
    :root { --bg: #ffffff; --text: #111111; --muted: #747074; --border: #E7E3E5; }
    [data-theme="dark"] { --bg: #111111; --text: #f5f5f5; --muted: #a0a0a0; --border: #333333; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: Inter, -apple-system, sans-serif; font-size: 14px; }
  </style>
</head>
<body>
  <div id="embed-view-root" style="padding:16px;min-height:100px"></div>
  <script type="module" src="js/embed.js"></script>
</body>
</html>
