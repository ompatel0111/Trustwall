<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — TrustFrame</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-brand" aria-hidden="true">
      <div class="auth-brand-logo">
        <img src="/images/logo.png" alt="TrustFrame">
        <span class="auth-brand-name">TrustFrame</span>
      </div>
      <div class="auth-brand-content">
        <h1 class="auth-brand-headline">Set a new<br>password.</h1>
        <p class="auth-brand-sub">Choose a strong password to keep your account secure.</p>
      </div>
    </div>
    <div class="auth-form-panel">
      <div class="auth-form-box">
        <div class="auth-form-header">
          <h2 class="auth-form-title">Reset password</h2>
          <p class="auth-form-sub">Enter the reset token and choose a new password.</p>
        </div>
        <form id="form-reset" class="auth-form" novalidate>
          <div class="auth-alert auth-alert-error hidden" role="alert" aria-live="polite"></div>
          <div class="form-group">
            <label class="form-label" for="token">Reset token</label>
            <input type="text" id="token" name="token" class="input" placeholder="Paste your reset token" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">New password</label>
            <div class="input-password-wrap">
              <input type="password" id="password" name="password" class="input" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8">
              <button type="button" class="input-password-toggle" aria-label="Show password">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm">Confirm new password</label>
            <input type="password" id="confirm" name="confirm" class="input" placeholder="Repeat your new password" autocomplete="new-password" required>
          </div>
          <button type="submit" class="btn btn-primary"><span class="btn-text">Reset password</span></button>
        </form>
        <div class="auth-link mt-6"><a href="/login.html">← Back to login</a></div>
      </div>
    </div>
  </div>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
