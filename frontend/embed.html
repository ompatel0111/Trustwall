<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Embed Generator — TrustFrame</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    .embed-layout { display: grid; grid-template-columns: 300px 1fr; gap: var(--space-6); align-items: start; }
    .embed-controls { display: flex; flex-direction: column; gap: var(--space-5); }
    .embed-control-label { font-size: var(--text-xs); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: var(--space-2); }
    .embed-option-group { display: flex; gap: var(--space-2); flex-wrap: wrap; }
    .embed-option-btn { padding: 0.5rem var(--space-4); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: 500; border: 1.5px solid var(--border); background: var(--white); color: var(--charcoal); cursor: pointer; transition: border-color var(--transition), background var(--transition), color var(--transition); }
    .embed-option-btn.active { border-color: var(--violet); background: var(--violet-light); color: var(--violet); }
    .embed-preview-frame { background: var(--off-white); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; min-height: 400px; }
    .embed-code-area { background: var(--charcoal); border-radius: var(--radius-md); padding: var(--space-4); position: relative; }
    .embed-code-textarea { width: 100%; background: transparent; border: none; color: #e2e8f0; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.6; resize: none; outline: none; height: 90px; }
    .embed-copy-btn { position: absolute; top: var(--space-3); right: var(--space-3); }
    @media (max-width: 768px) { .embed-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" role="navigation">
      <div class="sidebar-logo"><img src="/images/logo.png" alt="TrustFrame" style="width:34px;height:34px;object-fit:contain;border-radius:8px;"><span class="sidebar-logo-name"><span class="brand-trust">Trust</span><span class="brand-frame">Frame</span></span></div>
      <nav class="sidebar-nav">
        <a href="/dashboard.html" class="nav-link"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Overview</a>
        <a href="/spaces.html" class="nav-link"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Spaces</a>
        <a href="/testimonials.html" class="nav-link"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>Testimonials</a>
        <a href="/analytics.html" class="nav-link"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Analytics</a>
        <a href="/campaigns.html" class="nav-link"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>Campaigns</a>
        <a href="/embed.html" class="nav-link active" aria-current="page"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>Embed</a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user"><div id="sidebar-avatar" class="avatar avatar-sm">…</div><div class="sidebar-user-info"><div class="sidebar-user-name" id="sidebar-user-name">…</div><div class="sidebar-user-email" id="sidebar-user-email"></div></div></div>
        <button id="btn-logout" class="btn btn-ghost btn-sm w-full mt-2" style="justify-content:flex-start;color:var(--muted)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign out</button>
      </div>
    </aside>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div class="main-content">
      <header class="mobile-header">
        <button id="hamburger" class="hamburger" aria-label="Toggle menu"><span></span><span></span><span></span></button>
        <span style="font-family:var(--font-head);font-weight:800;font-size:1rem"><span style="color:#FFFFFF">Trust</span><span style="color:#a78bfa">Frame</span></span>
        <div style="width:36px"></div>
      </header>
      <div class="page-header">
        <div>
          <h1 class="page-title">Embed Generator</h1>
          <p class="text-sm text-muted mt-2" id="embed-space-name">Configure your widget</p>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <label for="space-select" class="text-xs text-muted" style="font-weight:600;text-transform:uppercase;letter-spacing:0.05em">Active Space:</label>
          <select id="space-select" class="input hidden" style="width:auto;min-width:180px;padding:0.45rem 2.2rem 0.45rem 0.85rem;font-size:0.875rem" aria-label="Select space"></select>
        </div>
      </div>

      <div id="no-spaces-state" class="empty-state hidden" style="padding:4rem 2rem">
        <div class="empty-icon">📁</div>
        <div class="empty-title">No spaces found</div>
        <div class="empty-desc">You need at least one Space before configuring and embedding testimonials.</div>
        <a href="/create-space.html" class="btn btn-primary mt-4">+ Create Space</a>
      </div>

      <main class="page-body" id="embed-generator">
        <div class="embed-layout">

          <!-- Controls -->
          <div class="card embed-controls">
            <h3 style="font-family:var(--font-head);font-weight:700;font-size:var(--text-md);color:var(--black);margin-bottom:var(--space-4)">Widget Settings</h3>

            <div>
              <div class="embed-control-label">Theme</div>
              <div class="embed-option-group">
                <button class="embed-option-btn active" data-theme="light">☀ Light</button>
                <button class="embed-option-btn" data-theme="dark">🌙 Dark</button>
              </div>
            </div>

            <div>
              <div class="embed-control-label">Layout</div>
              <div class="embed-option-group">
                <button class="embed-option-btn active" data-layout="grid">Grid</button>
                <button class="embed-option-btn" data-layout="carousel">Carousel</button>
                <button class="embed-option-btn" data-layout="badge">Badge</button>
              </div>
            </div>

            <div class="divider" style="margin:0"></div>

            <div>
              <div class="embed-control-label">Embed Code</div>
              <div class="embed-code-area">
                <textarea id="embed-code" class="embed-code-textarea" readonly aria-label="Embed iframe code"></textarea>
                <button id="btn-copy-code" class="btn btn-sm btn-secondary embed-copy-btn">Copy</button>
              </div>
            </div>
          </div>

          <!-- Preview -->
          <div>
            <div class="embed-control-label mb-3">Live Preview</div>
            <div class="embed-preview-frame">
              <iframe
                id="embed-preview"
                width="100%"
                height="500"
                frameborder="0"
                title="Widget preview"
                style="display:block"
              ></iframe>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>
  <div id="toast-container"></div>
  <script type="module" src="js/embed.js"></script>
  <script>
    document.getElementById('btn-logout')?.addEventListener('click', async () => {
      await fetch('http://localhost:5000/api/auth/logout', { method:'POST', credentials:'include' });
      window.location.href = '/login.html';
    });
  </script>
</body>
</html>
