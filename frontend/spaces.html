<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spaces — TrustFrame</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="app-shell">
    <!-- ── Sidebar (same across all dashboard pages) ────────── -->
    <aside id="sidebar" class="sidebar" role="navigation" aria-label="Main navigation">
      <div class="sidebar-logo">
        <img src="/images/logo.png" alt="TrustFrame" style="width:34px;height:34px;object-fit:contain;border-radius:8px;">
        <span class="sidebar-logo-name"><span class="brand-trust">Trust</span><span class="brand-frame">Frame</span></span>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard.html" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Overview
        </a>
        <a href="/spaces.html" class="nav-link active" aria-current="page">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Spaces
        </a>
        <a href="/testimonials.html" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          Testimonials
        </a>
        <a href="/analytics.html" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Analytics
        </a>
        <a href="/campaigns.html" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          Campaigns
        </a>
        <a href="/embed.html" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          Embed
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div id="sidebar-avatar" class="avatar avatar-sm" aria-hidden="true">…</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebar-user-name">…</div>
            <div class="sidebar-user-email" id="sidebar-user-email"></div>
          </div>
        </div>
        <button id="btn-logout" class="btn btn-ghost btn-sm w-full mt-2" style="justify-content:flex-start;color:var(--muted)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign out
        </button>
      </div>
    </aside>
    <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

    <div class="main-content">
      <header class="mobile-header">
        <button id="hamburger" class="hamburger" aria-label="Toggle menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <span style="font-family:var(--font-head);font-weight:800;font-size:1rem"><span style="color:#FFFFFF">Trust</span><span style="color:#a78bfa">Frame</span></span>
        <div style="width:36px"></div>
      </header>
      <div class="page-header">
        <div>
          <h1 class="page-title">Spaces</h1>
          <p class="text-sm text-muted mt-2">Manage your testimonial collection spaces.</p>
        </div>
        <button class="btn btn-primary btn-sm" id="btn-create-space">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Space
        </button>
      </div>

      <main class="page-body">
        <div id="spaces-grid" class="grid grid-2 gap-6" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">
          <!-- Spaces rendered by JS -->
        </div>
      </main>
    </div>
  </div>

  <!-- ── Create Space Modal ──────────────────────────────────── -->
  <div id="modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Create a Space</h2>
        <button id="btn-close-modal" class="btn btn-icon btn-ghost" aria-label="Close modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="form-create-space">
        <div class="modal-body" style="display:flex;flex-direction:column;gap:1.25rem">
          <div class="form-group">
            <label class="form-label" for="space-name">Space name <span aria-hidden="true" style="color:var(--error)">*</span></label>
            <input type="text" id="space-name" name="name" class="input" placeholder="e.g. Acme Corp" required maxlength="100">
          </div>
          <div class="form-group">
            <label class="form-label" for="space-slug">
              URL slug
              <span class="form-hint" style="font-weight:400"> — auto-generated from name</span>
            </label>
            <div style="display:flex;align-items:center;gap:0">
              <span class="input" style="border-radius:var(--radius-md) 0 0 var(--radius-md);border-right:none;background:var(--off-white);color:var(--muted);white-space:nowrap;width:auto;padding-right:0">/collect/</span>
              <input type="text" id="space-slug" name="slug" class="input" style="border-radius:0 var(--radius-md) var(--radius-md) 0" placeholder="acme-corp" required pattern="[a-z0-9\-]+" minlength="3" maxlength="50">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="space-description">Description</label>
            <input type="text" id="space-description" name="description" class="input" placeholder="Brief description of your business" maxlength="200">
          </div>
          <div class="form-group">
            <label class="form-label" for="space-prompt">Collection prompt</label>
            <input type="text" id="space-prompt" name="prompt" class="input" value="How was your experience?" maxlength="200">
            <span class="form-hint">The question shown to customers on the collection form.</span>
          </div>
          <label style="display:flex;align-items:center;gap:12px;cursor:pointer">
            <input type="checkbox" name="enable_rating" id="enable-rating" checked style="accent-color:var(--violet);width:16px;height:16px">
            <span class="form-label" style="margin:0">Enable star ratings</span>
          </label>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btn-cancel-modal">Cancel</button>
          <button type="submit" class="btn btn-primary"><span class="btn-text">Create Space</span></button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" aria-live="polite"></div>
  <script type="module" src="js/spaces.js"></script>
  <script>
    // Cancel button duplicates close logic
    document.getElementById('btn-cancel-modal')?.addEventListener('click', () => {
      document.getElementById('modal-backdrop').classList.remove('open');
    });
  </script>
</body>
</html>
