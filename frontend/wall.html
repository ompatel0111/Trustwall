<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wall of Love — TrustFrame</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="css/wall.css">
</head>
<body>
  <div class="wall-shell">
    <header class="wall-header">
      <div class="wall-logo" id="wall-logo" aria-hidden="true">…</div>
      <h1 class="wall-title" id="wall-title">Wall of Love</h1>
      <p class="wall-subtitle">What our customers are saying.</p>
    </header>

    <div class="wall-stats" role="region" aria-label="Review statistics">
      <div class="wall-stat">
        <div class="wall-stat-val" id="wall-stat-total">—</div>
        <div class="wall-stat-lbl">Reviews</div>
      </div>
      <div class="wall-stat">
        <div class="wall-stat-val" id="wall-stat-avg">—</div>
        <div class="wall-stat-lbl">Avg Rating</div>
      </div>
      <div class="wall-stat">
        <div id="wall-stat-avg-stars"></div>
        <div class="wall-stat-lbl sr-only">Star rating</div>
      </div>
    </div>

    <main>
      <div class="wall-masonry" id="wall-masonry">
        <!-- Skeleton loaders -->
        <div class="wall-card"><div class="skeleton skeleton-text mb-3" style="height:0.75rem;width:50%"></div><div class="skeleton skeleton-text mb-2" style="height:0.875rem"></div><div class="skeleton skeleton-text mb-2" style="height:0.875rem;width:80%"></div><div class="wall-card-header"><div class="skeleton skeleton-avatar" style="width:40px;height:40px"></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div class="skeleton skeleton-text" style="width:55%"></div><div class="skeleton skeleton-text" style="width:40%"></div></div></div></div>
        <div class="wall-card"><div class="skeleton skeleton-text mb-3" style="height:0.75rem;width:50%"></div><div class="skeleton skeleton-text mb-2" style="height:0.875rem"></div><div class="skeleton skeleton-text mb-2" style="height:0.875rem;width:90%"></div><div class="skeleton skeleton-text mb-4" style="height:0.875rem;width:70%"></div><div class="wall-card-header"><div class="skeleton skeleton-avatar" style="width:40px;height:40px"></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div class="skeleton skeleton-text" style="width:50%"></div><div class="skeleton skeleton-text" style="width:35%"></div></div></div></div>
        <div class="wall-card"><div class="skeleton skeleton-text mb-3" style="height:0.75rem;width:50%"></div><div class="skeleton skeleton-text mb-2" style="height:0.875rem"></div><div class="skeleton skeleton-text mb-2" style="height:0.875rem;width:60%"></div><div class="wall-card-header"><div class="skeleton skeleton-avatar" style="width:40px;height:40px"></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div class="skeleton skeleton-text" style="width:60%"></div><div class="skeleton skeleton-text" style="width:45%"></div></div></div></div>
      </div>
    </main>

    <footer class="wall-footer">
      Powered by <a href="/" target="_blank">TrustFrame</a> · Collect and showcase customer testimonials
    </footer>
  </div>

  <script type="module" src="js/wall.js"></script>
</body>
</html>
